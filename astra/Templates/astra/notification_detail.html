{% extends 'base.html' %} <!-- Remplacez par votre layout principal si nécessaire -->
{% load static %}

{% block content %}
<div class="main-container" style="padding: 30px; max-width: 800px; margin: 40px auto;">
    <div style="background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-left: 6px solid #f97316;">
        
        <!-- En-tête de la notification -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <i class="fas fa-bell" style="font-size: 1.5rem; color: #f97316;"></i>
                <h1 style="margin: 0; font-size: 1.4rem; font-weight: bold; color: #0f172a;">{{ notif.titre }}</h1>
            </div>
            <span style="font-size: 0.85rem; color: #64748b; background: #f1f5f9; padding: 5px 10px; border-radius: 20px;">
                <i class="far fa-clock me-1"></i> {{ notif.date_creation|date:"d/m/Y à H:i" }}
            </span>
        </div>

        <!-- Message complet -->
        <div style="margin-bottom: 30px;">
            <p style="font-size: 1rem; color: #334155; line-height: 1.6; white-space: pre-line;">
                {{ notif.message }}
            </p>
        </div>

        <!-- Actions / Bouton de retour -->
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
            <a href="javascript:history.back()" class="btn btn-secondary px-4 py-2" style="background: #e2e8f0; color: #334155; border: none; border-radius: 8px; text-decoration: none; font-weight: 500;">
                <i class="fas fa-arrow-left me-2"></i> Retour
            </a>
        </div>
    </div>
</div>
{% endblock %}
