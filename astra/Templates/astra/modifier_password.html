<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le mot de passe - Astra Tech</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            text-align: center;
        }
        h2 {
            color: #1e293b;
            margin-bottom: 10px;
        }
        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #f97316;
        }
        .btn-submit {
            background-color: #f97316;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #ea580c;
        }
        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .alert-success {
            background-color: #dcfce7;
            color: #166534;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover {
            color: #f97316;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Sécurité</h2>
        <p>Mettez à jour le mot de passe pour <strong style="color: #1e293b;">{{ client.nom }}</strong>.</p>

        <!-- Affichage des messages Django (Erreurs ou Succès) -->
        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- ACTION DYNAMIQUE : Pointe vers l'ID unique de chaque client -->
        <form method="POST" action="{% url 'astra:modifier_mot_de_passe_client' client.id %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Nouveau mot de passe</label>
                <input type="password" name="nouveau_password" placeholder="Entrez le nouveau mot de passe" required>
            </div>

            <div class="form-group">
                <label>Confirmer le mot de passe</label>
                <input type="password" name="confirm_password" placeholder="Répétez le nouveau mot de passe" required>
            </div>

            <button type="submit" class="btn-submit">Mettre à jour le mot de passe</button>
        </form>

        <!-- LIEN DE RETOUR DYNAMIQUE (Pointe vers l'espace du client actuel via client.id) -->
      <!-- Modification pour rediriger vers la page de connexion -->
<a href="{% url 'astra:client_login' client.id %}" class="back-link">← Retour à la connexion</a>
    </div>

</body>
</html>
