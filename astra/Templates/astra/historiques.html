<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRA TECH - Journal d'Activités</title>
     <!-- Script d’initialisation immédiate du mode nuit global -->
    <script>
        (function() {
            const savedDarkMode = localStorage.getItem('astra_dark_mode');
            if (savedDarkMode === 'true') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --tech-blue: #0078D7;
            --tech-dark-blue: #004E8C;
            --tech-sidebar-bg: #003366;
            --tech-orange: #FF8C00;
            --tech-orange-hover: #e67e00;
            --tech-white: #FFFFFF;
            --tech-light-gray: #F4F6F9;
            --tech-card-bg: #ffffff;
            --tech-dark-gray: #333333;
            --tech-border: #E0E0E0;
            --sidebar-width: 280px;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--tech-light-gray);
            color: var(--tech-dark-gray);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
        }

        
 
/* --- MODE NUIT GLOBAL POUR LES PAGES --- */
html.dark body {
    background-color: #0f172a;
    color: #f1f5f9;
}

html.dark .app-section,
html.dark .card,
html.dark .stat-card,
html.dark .feature-card {
    background-color: #1e293b !important;
    border-color: #334155 !important;
    color: #f1f5f9 !important;
}

html.dark h1, 
html.dark h3, 
html.dark p, 
html.dark .user-name, 
html.dark .stat-value, 
html.dark .feature-desc {
    color: #f1f5f9 !important;
}
        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, var(--tech-dark-blue) 0%, #003366 100%);
            color: var(--tech-white);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            box-shadow: 4px 0 25px rgba(0, 0, 0, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar-brand {
            padding: 30px 24px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-logo {
            width: 40px;
            height: 40px;
            background: var(--tech-white);
            border-radius: 8px;
            transform: rotate(45deg);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .sidebar-logo-inner {
            width: 28px;
            height: 28px;
            border: 2px solid var(--tech-orange);
            border-radius: 5px;
            transform: rotate(-45deg);
        }

        .sidebar-title {
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .sidebar-title span {
            color: var(--tech-orange);
        }

        .nav-menu {
            list-style: none;
            padding: 24px 16px;
            margin: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }

        .nav-menu li a,
        .nav-menu a.back-link {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            border-radius: var(--radius-md);
            transition: all 0.25s ease;
        }

        .nav-menu li a i,
        .nav-menu a.back-link i {
            margin-right: 14px;
            font-size: 16px;
            width: 22px;
            text-align: center;
            transition: transform 0.25s;
        }

        .nav-menu li a:hover,
        .nav-menu a.back-link:hover {
            color: var(--tech-white);
            background-color: rgba(255, 255, 255, 0.08);
        }

        .nav-menu li a:hover i,
        .nav-menu a.back-link:hover i {
            transform: translateX(3px);
        }

        .nav-menu li a.active {
            color: var(--tech-white);
            background-color: rgba(255, 255, 255, 0.12);
            border-left: 4px solid var(--tech-orange);
            font-weight: 600;
        }

        .nav-menu a.back-link {
            margin-top: auto;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-menu a.back-link:hover {
            background-color: var(--tech-dark-blue);
        }

        .sidebar-footer {
            padding: 20px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-logout {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--tech-white);
            border: none;
            padding: 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-logout:hover {
            background-color: #ff4d4d;
            box-shadow: 0 4px 12px rgba(255, 77, 77, 0.3);
        }

        /* --- CONTENU PRINCIPAL --- */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 40px;
            max-width: calc(100% - var(--sidebar-width));
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--tech-card-bg);
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--tech-border);
        }

        /* Styles de la constellation */
        #constellation-container {
            position: relative;
            width: 100%;
            height: 550px;
            overflow: hidden;
            background-color: #0b1120;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .constellation-node {
            position: absolute;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.85;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
            filter: brightness(1.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            z-index: 10;
        }

        .constellation-node:hover {
            transform: scale(1.2);
            opacity: 1;
            z-index: 50;
        }
        
        .node-icon {
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .node-details {
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 0.75rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        .constellation-node:hover .node-details {
            opacity: 1;
            visibility: visible;
        }

        /* Couleurs pour les actions */
        .bg-create { background-color: #10b981; }
        .bg-update { background-color: #3b82f6; }
        .bg-delete { background-color: #ef4444; }
        .bg-login { background-color: #f59e0b; }
        .bg-view { background-color: #6b7280; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="sidebar-logo">
                <div class="sidebar-logo-inner"></div>
            </div>
            <div class="sidebar-title">ASTRA <span>TECH</span></div>
        </div>

        <ul class="nav-menu">
            <li><a href="{% url 'astra:token_accueil' %}"><i class="fas fa-key"></i> Gestion des Tokens</a></li>
            <li><a href="{% url 'astra:page_utilisateurs' %}"><i class="fas fa-users"></i> Utilisateurs</a></li>
            <li><a href="{% url 'astra:permissions_page' %}"><i class="fas fa-shield-alt"></i> Permissions</a></li>
            <li><a href="{% url 'astra:historiques_page' %}" class="active"><i class="fas fa-history"></i> Historique</a></li>
            <li><a href="{% url 'astra:parametres_page' %}"><i class="fas fa-cog"></i> Paramètres</a></li>

            <a href="#" onclick="history.back(); return false;" class="back-link">
                <i class="fas fa-arrow-left text-white text-lg"></i>
                <span>Retour</span>
            </a>
        </ul>

        <div class="sidebar-footer">
            <a href="{% url 'astra:logout' %}" class="btn-logout" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Journal d'Activités</h1>
        
        <!-- Filtres et Recherche -->
        <div class="card p-6 mb-6">
            <div class="flex flex-wrap items-center gap-4">
                <div class="relative w-full md:w-auto flex-grow">
                    <input type="text" id="search-input" placeholder="Rechercher une action, un utilisateur ou une adresse IP..." class="w-full rounded-full bg-gray-100 text-gray-800 border border-gray-300 shadow-sm p-3 pl-10 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <i class="fas fa-search text-gray-400"></i>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button data-filter="all" class="filter-btn bg-blue-600 text-white font-semibold py-2 px-5 rounded-full hover:bg-blue-700 transition-colors shadow-sm cursor-pointer">
                        Tout
                    </button>
                    <button data-filter="Création" class="filter-btn bg-gray-200 text-gray-700 font-semibold py-2 px-5 rounded-full hover:bg-gray-300 transition-colors cursor-pointer">
                        Création
                    </button>
                    <button data-filter="Modification" class="filter-btn bg-gray-200 text-gray-700 font-semibold py-2 px-5 rounded-full hover:bg-gray-300 transition-colors cursor-pointer">
                        Modification
                    </button>
                    <button data-filter="Suppression" class="filter-btn bg-gray-200 text-gray-700 font-semibold py-2 px-5 rounded-full hover:bg-gray-300 transition-colors cursor-pointer">
                        Suppression
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Constellation Container -->
        <div id="constellation-container">
            <canvas id="constellation-canvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
            <div id="nodes-container" class="absolute inset-0 w-full h-full"></div>
        </div>
    </main>

    <!-- SCRIPT DE LA CONSTELLATION -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const historyData = [
                { date: '2026-07-23 16:00', user: 'Jeanne Dupont', action: 'Création', details: 'Création du token d\'accès "Accès Invité"', ip: '192.168.1.1' },
                { date: '2026-07-23 15:35', user: 'Pierre Martin', action: 'Modification', details: 'Modification des permissions du rôle "Support"', ip: '203.0.113.5' },
                { date: '2026-07-23 15:30', user: 'Pierre Martin', action: 'Connexion', details: 'Connexion réussie', ip: '203.0.113.5' },
                { date: '2026-07-23 15:00', user: 'Jeanne Dupont', action: 'Consultation', details: 'Consultation du journal des activités', ip: '192.168.1.1' },
                { date: '2026-07-23 14:25', user: 'Jeanne Dupont', action: 'Suppression', details: 'Suppression du token "Stagiaire-été"', ip: '192.168.1.1' },
                { date: '2026-07-23 13:45', user: 'Pierre Martin', action: 'Création', details: 'Ajout d\'un nouvel utilisateur "Lucie D."', ip: '203.0.113.5' },
            ];
            
            const actionMap = {
                'Création': { icon: 'fas fa-plus', color: 'bg-create' },
                'Modification': { icon: 'fas fa-pen', color: 'bg-update' },
                'Suppression': { icon: 'fas fa-trash-alt', color: 'bg-delete' },
                'Connexion': { icon: 'fas fa-sign-in-alt', color: 'bg-login' },
                'Consultation': { icon: 'fas fa-eye', color: 'bg-view' },
            };

            const container = document.getElementById('constellation-container');
            const nodesContainer = document.getElementById('nodes-container');
            const canvas = document.getElementById('constellation-canvas');
            const ctx = canvas.getContext('2d');
            const searchInput = document.getElementById('search-input');
            const filterButtons = document.querySelectorAll('.filter-btn');

            let activeFilter = 'all';
            let nodePositions = [];
            let filteredData = [];

            function resizeCanvas() {
                if (container) {
                    canvas.width = container.clientWidth;
                    canvas.height = container.clientHeight;
                }
            }

            function drawLines() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(100, 149, 237, 0.4)';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(100, 149, 237, 0.8)';
                
                if (nodePositions.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(nodePositions[0].x, nodePositions[0].y);
                    for (let i = 1; i < nodePositions.length; i++) {
                        ctx.lineTo(nodePositions[i].x, nodePositions[i].y);
                    }
                    ctx.stroke();
                }
            }

            function renderConstellation() {
                nodesContainer.innerHTML = '';
                nodePositions = [];
                
                const searchTerm = searchInput.value.toLowerCase();
                
                filteredData = historyData.filter(item => {
                    const matchesFilter = activeFilter === 'all' || item.action === activeFilter;
                    const matchesSearch = searchTerm === '' || 
                                          item.details.toLowerCase().includes(searchTerm) ||
                                          item.user.toLowerCase().includes(searchTerm) ||
                                          item.ip.toLowerCase().includes(searchTerm);
                    return matchesFilter && matchesSearch;
                });

                if (filteredData.length === 0) {
                    nodesContainer.innerHTML = '<p class="text-center text-gray-400 mt-20">Aucun résultat ne correspond à votre recherche.</p>';
                    drawLines();
                    return;
                }

                filteredData.forEach((item) => {
                    const nodeDiv = document.createElement('div');
                    const actionInfo = actionMap[item.action] || { icon: 'fas fa-info-circle', color: 'bg-view' };
                    const nodeSize = 75;
                    
                    nodeDiv.classList.add('constellation-node', actionInfo.color);
                    nodeDiv.style.width = `${nodeSize}px`;
                    nodeDiv.style.height = `${nodeSize}px`;

                    const nodeIcon = document.createElement('div');
                    nodeIcon.classList.add('node-icon');
                    nodeIcon.innerHTML = `<i class="${actionInfo.icon}"></i>`;
                    
                    const nodeDetails = document.createElement('div');
                    nodeDetails.classList.add('node-details');
                    nodeDetails.innerHTML = `
                        <p class="text-xs text-gray-400 mb-1">${item.date}</p>
                        <h4 class="font-semibold text-sm text-white">${item.user}</h4>
                        <p class="text-xs text-gray-300 mt-1">${item.details}</p>
                    `;
                    
                    nodeDiv.appendChild(nodeIcon);
                    nodeDiv.appendChild(nodeDetails);
                    nodesContainer.nodesContainer ? null : nodesContainer.appendChild(nodeDiv);
                });

                // Append all elements properly
                filteredData.forEach((item, index) => {
                    // handled inside or re-run
                });

                // Correction loop to append properly
                nodesContainer.innerHTML = '';
                filteredData.forEach((item) => {
                    const nodeDiv = document.createElement('div');
                    const actionInfo = actionMap[item.action] || { icon: 'fas fa-info-circle', color: 'bg-view' };
                    const nodeSize = 75;
                    
                    nodeDiv.classList.add('constellation-node', actionInfo.color);
                    nodeDiv.style.width = `${nodeSize}px`;
                    nodeDiv.style.height = `${nodeSize}px`;

                    const nodeIcon = document.createElement('div');
                    nodeIcon.classList.add('node-icon');
                    nodeIcon.innerHTML = `<i class="${actionInfo.icon}"></i>`;
                    
                    const nodeDetails = document.createElement('div');
                    nodeDetails.classList.add('node-details');
                    nodeDetails.innerHTML = `
                        <p class="text-xs text-gray-400 mb-1">${item.date}</p>
                        <h4 class="font-semibold text-sm text-white">${item.user}</h4>
                        <p class="text-xs text-gray-300 mt-1">${item.details}</p>
                    `;
                    
                    nodeDiv.appendChild(nodeIcon);
                    nodeDiv.appendChild(nodeDetails);
                    nodesContainer.appendChild(nodeDiv);
                });

                positionNodes();
            }

            function positionNodes() {
                const containerRect = container.getBoundingClientRect();
                nodePositions = [];
                const padding = 70;

                filteredData.forEach((item, index) => {
                    const node = nodesContainer.children[index];
                    if (!node) return;
                    let x, y;
                    let isColliding;
                    let attempts = 0;

                    do {
                        x = Math.random() * (containerRect.width - padding * 2) + padding / 2;
                        y = Math.random() * (containerRect.height - padding * 2) + padding / 2;
                        isColliding = false;
                        attempts++;

                        for (let i = 0; i < nodePositions.length; i++) {
                            const prevNode = nodePositions[i];
                            const distance = Math.hypot(x - prevNode.x, y - prevNode.y);
                            if (distance < 110) {
                                isColliding = true;
                                break;
                            }
                        }
                    } while (isColliding && attempts < 50);
                    
                    node.style.left = `${x}px`;
                    node.style.top = `${y}px`;
                    
                    nodePositions.push({
                        x: x + 37.5, // Center offset of 75px node
                        y: y + 37.5
                    });
                });
                drawLines();
            }

            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    activeFilter = button.getAttribute('data-filter');
                    filterButtons.forEach(btn => {
                        btn.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
                        btn.classList.add('bg-gray-200', 'text-gray-700');
                    });
                    button.classList.remove('bg-gray-200', 'text-gray-700');
                    button.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
                    renderConstellation();
                });
            });

            searchInput.addEventListener('input', renderConstellation);

            window.addEventListener('resize', () => {
                resizeCanvas();
                positionNodes();
            });

            resizeCanvas();
            renderConstellation();
        });
    </script>
</body>
</html>
